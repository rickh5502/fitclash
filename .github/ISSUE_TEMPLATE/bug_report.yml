name: Bug report
description: Something in FitClash didn't work right.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-you-did
    attributes:
      label: What did you tap or do?
      description: Just walk through it in order, e.g. "logged in, went to Log Workout, tapped Bench Press, entered 135 x 5"
      placeholder: I was on the ... screen and tapped ...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw — an error, a blank screen, wrong numbers, nothing happening, etc.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and browser
      description: e.g. "iPhone 14, Safari" or "Windows laptop, Chrome"
      placeholder: iPhone 14, Safari
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshot, how often it happens, etc. (optional)
    validations:
      required: false
