<style>
  /* FitClash is a committed dark HUD: a gym at night, calibrated-plate colour.
     It does not follow the host theme, so every colour is painted explicitly. */
  :root { color-scheme: dark; }
  html, body { height: 100%; background: #13161B; }
  #root { min-height: 100%; }
  body { margin: 0; color: #F2EFE7; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  ::selection { background: #FF7A1A; color: #0D1014; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0D1014; }
  ::-webkit-scrollbar-thumb { background: #333945; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  .boot { display: grid; place-items: center; min-height: 60vh; color: #8B94A3;
          font-family: 'Barlow Condensed', system-ui, sans-serif; letter-spacing: .18em;
          text-transform: uppercase; font-size: 13px; }
</style>

</script>
