  return Icon;
};

/* ------------------------------------------------------------------ rules */
/* Mirrors GameProperties.java + Formulas.java. Keep the two in step. */

const RULES = {
  dailyXpCap: 1000,
  freeSetsPerExercise: 5,
  diminishingFactor: 0.5,
  minMultiplier: 0.03125,
  strengthXpDivisor: 60,
  cardioXpPerMinute: 3,
  bodyweightLoadKg: 35,
  maxSetVolumeKg: 5000,
  maxWeightKg: 500,
  maxRepsPerSet: 150,
  maxSetsPerExercisePerDay: 25,
  reviewFlagRatio: 0.75,
  liftCeilings: [
    ['leg-press', 800], ['hip-thrust', 600], ['deadlift', 550], ['squat', 500],
    ['bench-press', 350], ['bench', 350], ['row', 300], ['overhead-press', 250],
    ['shoulder-press', 250], ['pulldown', 200], ['curl', 120], ['lateral-raise', 60],
  ],
};

const slugify = (name) =>
  name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'unnamed';

const ceilingFor = (slug) => {
  const hit = RULES.liftCeilings.find(([key]) => slug.includes(key));
  return hit ? hit[1] : null;
};

const volumeKg = (kind, weightKg, reps) => {
  if (kind === 'CARDIO') return 0;
  if (kind === 'BODYWEIGHT') return (weightKg + RULES.bodyweightLoadKg) * reps;
  return weightKg * reps;
};

const epleyE1rm = (weightKg, reps) => (reps <= 0 || weightKg <= 0 ? 0 : weightKg * (1 + reps / 30));

const rawSetXp = (kind, volume, durationSec, intensity) =>
  kind === 'CARDIO'
    ? (durationSec / 60) * RULES.cardioXpPerMinute * (intensity / 5)
    : volume / RULES.strengthXpDivisor;

// Sets 1-5 of an exercise pay in full; every set after that halves again.
const diminishingMultiplier = (setIndex) =>
  setIndex <= RULES.freeSetsPerExercise
    ? 1
    : Math.max(RULES.minMultiplier, RULES.diminishingFactor ** (setIndex - RULES.freeSetsPerExercise));

const xpForNextLevel = (level) => Math.floor(100 * level ** 1.5);

const strengthStat = (p) => Math.min(99, 5 + Math.floor(8 * Math.log10(1 + Math.max(0, p))));
const staminaStat = (p) => Math.min(99, 5 + Math.floor(8 * Math.log10(1 + Math.max(0, p))));
const consistencyStat = (activeDays30, streak) =>
  Math.min(99, 5 + Math.floor(25 * Math.min(1, activeDays30 / 30) ** 1.2) + Math.min(10, Math.floor(streak / 3)));

/**
 * Resolves setIndex/multiplier/volume/XP for every drafted set from its
 * position in the current draft, not from whatever was true when it was
 * added. Deleting a set must renumber everything after it, so these values
 * are never frozen onto the draft item itself.
 */
function deriveDraft(draft, setsToday) {
  const counts = {};
  return draft.map((d) => {
    const slug = slugify(d.exerciseName);
    const already = setsToday[slug] ?? 0;
    counts[slug] = (counts[slug] ?? 0) + 1;
    const setIndex = already + counts[slug];
    const mult = diminishingMultiplier(setIndex);
    const volume = volumeKg(d.kind, d.weightKg, d.reps);
    const raw = rawSetXp(d.kind, volume, d.durationSec, d.intensity);
    return { ...d, setIndex, mult, volume, raw, net: raw * mult };
  });
}

/** Agent 2's gate, client-side. The server runs the identical check and wins. */
function inspectSet(entry, dailyIndex, bestE1rm) {
  const rejections = [];
  const slug = slugify(entry.exerciseName);
  const volume = volumeKg(entry.kind, entry.weightKg, entry.reps);
  const ceiling = ceilingFor(slug);

  if (dailyIndex > RULES.maxSetsPerExercisePerDay)
    rejections.push(`That is set ${dailyIndex} of this exercise today. The limit is ${RULES.maxSetsPerExercisePerDay}.`);
  if (entry.kind !== 'CARDIO' && entry.reps <= 0) rejections.push('A set needs at least one rep.');
  if (entry.kind === 'STRENGTH' && entry.weightKg <= 0)
    rejections.push('A strength set needs a load. Log unloaded work as bodyweight.');
  if (entry.kind === 'CARDIO' && entry.durationSec <= 0) rejections.push('A cardio entry needs a duration.');
  if (entry.weightKg < 0) rejections.push('Weight cannot be negative.');
  if (entry.reps > RULES.maxRepsPerSet)
    rejections.push(`${entry.reps} reps in one set is not a set, it is a typo (max ${RULES.maxRepsPerSet}).`);
  if (entry.weightKg > RULES.maxWeightKg)
    rejections.push(`${entry.weightKg} kg is above the ${RULES.maxWeightKg} kg absolute ceiling.`);
  if (volume > RULES.maxSetVolumeKg)
    rejections.push(`${Math.round(volume)} kg of volume in one set exceeds the ${RULES.maxSetVolumeKg} kg cap.`);
  if (ceiling && entry.weightKg > ceiling)
    rejections.push(`${entry.weightKg} kg is past the ${ceiling} kg verified limit for this lift.`);

  let flag = null;
  if (ceiling && entry.weightKg >= ceiling * RULES.reviewFlagRatio)
    flag = 'Near-elite load, unverified. Earns XP but will not count toward duels.';
  else if (volume >= RULES.maxSetVolumeKg * RULES.reviewFlagRatio)
    flag = 'Unusually high single-set volume. Excluded from duel scoring.';
  else if (entry.kind === 'STRENGTH' && bestE1rm > 0 && epleyE1rm(entry.weightKg, entry.reps) > bestE1rm * 1.25)
    flag = 'More than 25% above your own best. Excluded from duel scoring.';

  return { rejections, flag };
}

/** The RPG avatar: a figure pressing a loaded bar, breathing on an idle loop. */
function Avatar({ level, glow, size = 176 }) {
  const aura = Math.min(1, 0.25 + level / 24);
  const reduceMotion = useReducedMotion();
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <motion.div
        aria-hidden
        className="absolute inset-0 rounded-full"
        style={{
          background: `radial-gradient(circle at 50% 55%, rgba(255,122,26,${0.32 * aura}) 0%, rgba(255,122,26,0.06) 45%, transparent 70%)`,
        }}
        animate={reduceMotion
          ? { scale: 1, opacity: glow ? 1 : 0.7 }
          : { scale: glow ? [1, 1.28, 1] : [1, 1.06, 1], opacity: glow ? [0.8, 1, 0.8] : [0.55, 0.8, 0.55] }}
        transition={reduceMotion ? { duration: 0 } : { duration: glow ? 0.7 : 4.5, repeat: Infinity, ease: 'easeInOut' }}
      />
      <svg viewBox="0 0 120 120" className="relative w-full h-full" role="img" aria-label="Your character">
        <circle cx="60" cy="60" r="52" fill="#1B1F26" stroke="#333945" strokeWidth="1.5" />
        <circle cx="60" cy="60" r="52" fill="none" stroke="#FF7A1A" strokeWidth="2"
          strokeDasharray={`${aura * 327} 327`} strokeLinecap="round" transform="rotate(-90 60 60)" opacity="0.9" />
        <motion.g
          animate={reduceMotion ? { y: 0 } : { y: [0, -1.6, 0] }}
          transition={reduceMotion ? { duration: 0 } : { duration: 3.2, repeat: Infinity, ease: 'easeInOut' }}

function XpBar({ currentXp, needed, flash }) {
  const pct = Math.max(0, Math.min(100, (currentXp / needed) * 100));
  return (
    <div>
      <div className="flex items-baseline justify-between mb-1.5">
        <Eyebrow>Experience</Eyebrow>
        <span className="font-data text-sm text-chalk-dim tabular-nums">
          {fmt(currentXp)} / {fmt(needed)}
        </span>
      </div>
      <div
        className="relative h-3 rounded-full bg-iron-950 border border-iron-700 overflow-hidden"
        role="progressbar"
        aria-valuenow={Math.round(currentXp)}
        aria-valuemin={0}
        aria-valuemax={Math.round(needed)}
        aria-label="Experience"
      >
        <motion.div
          className="absolute inset-y-0 left-0 rounded-full"
          style={{ background: 'linear-gradient(90deg,#FF7A1A,#E9B424)' }}
          initial={false}
          animate={{ width: `${pct}%` }}
          transition={{ type: 'spring', stiffness: 90, damping: 16 }}
        />
        <AnimatePresence>
          {flash && (
            <motion.div
              className="absolute inset-0 bg-chalk"
              initial={{ opacity: 0.85 }}
              animate={{ opacity: 0 }}
              exit={{ opacity: 0 }}
              transition={{ duration: 0.6 }}
            />
          )}
        </AnimatePresence>
      </div>
    </div>
  );
}

        aria-valuemin={0}
        aria-valuemax={ceiling}
        aria-label={`${full} — out of ${ceiling} (${ceilingLabel})`}
      >
        <motion.div
          className="h-full rounded-full"
          style={{ background: color }}
          initial={false}
          animate={{ width: `${Math.min(100, (value / ceiling) * 100)}%` }}
          transition={{ type: 'spring', stiffness: 120, damping: 18 }}
        />
      </div>
      <p className="pl-1 mt-1 font-data text-[10px] uppercase tracking-[0.14em] text-chalk-muted">
        out of {ceiling} ({ceilingLabel})
      </p>
    </Panel>
  );
}

function DailyBudget({ dailyXp }) {
  const pct = Math.min(100, (dailyXp / RULES.dailyXpCap) * 100);
  const spent = dailyXp >= RULES.dailyXpCap;
  return (
    <div className="flex items-center gap-2.5 min-w-0">
      <div className="text-right hidden sm:block">
        <Eyebrow className="leading-none">Daily cap</Eyebrow>
        <div className={`font-data text-sm tabular-nums ${spent ? 'text-plate-strText' : 'text-chalk-dim'}`}>
          {fmt(dailyXp)}/{fmt(RULES.dailyXpCap)}
        </div>
      </div>
      <div
        className="w-16 h-1.5 rounded-full bg-iron-950 border border-iron-700 overflow-hidden shrink-0"
        role="progressbar"
        aria-valuenow={Math.round(dailyXp)}
        aria-valuemin={0}
        aria-valuemax={RULES.dailyXpCap}
        aria-label="Daily XP cap"
      >
        <motion.div
          className="h-full"
          style={{ background: spent ? '#D8322C' : '#E9B424' }}
          initial={false}
          animate={{ width: `${pct}%` }}
          transition={{ type: 'spring', stiffness: 110, damping: 18 }}
        />
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- logger */

function Logger({ hero, setsToday, draft, setDraft, onBank, notify }) {
  const [picked, setPicked] = useState(EXERCISES[0]);
  const [weight, setWeight] = useState(EXERCISES[0].weight);
  const [reps, setReps] = useState(EXERCISES[0].reps);
  const [minutes, setMinutes] = useState(30);
  const [intensity, setIntensity] = useState(6);

  const isCardio = picked.kind === 'CARDIO';

  const choose = (ex) => {
    setPicked(ex);
    if (ex.kind === 'CARDIO') {
      setMinutes(ex.minutes ?? 30);
      setIntensity(ex.intensity ?? 6);
    } else {
      setWeight(ex.weight ?? 0);
      setReps(ex.reps ?? 8);
    }
  };

  // How many sets of the picked exercise are already logged today, before
  // counting anything still sitting in the draft.
  const alreadyLogged = useMemo(
    () => setsToday[slugify(picked.name)] ?? 0,
    [picked, setsToday],
  );

  // The set index this entry would take today, counting what is already drafted.
  const nextIndex = useMemo(() => {
    const slug = slugify(picked.name);
    const drafted = draft.filter((d) => slugify(d.exerciseName) === slug).length;
    return alreadyLogged + drafted + 1;
  }, [picked, draft, alreadyLogged]);

  const candidate = {
    exerciseName: picked.name,
    kind: picked.kind,
    weightKg: isCardio ? 0 : Number(weight) || 0,
    reps: isCardio ? 0 : Number(reps) || 0,
    durationSec: isCardio ? (Number(minutes) || 0) * 60 : 0,
    intensity: isCardio ? Number(intensity) || 5 : 5,
  };

  const preview = useMemo(() => {
    const vol = volumeKg(candidate.kind, candidate.weightKg, candidate.reps);
    const raw = rawSetXp(candidate.kind, vol, candidate.durationSec, candidate.intensity);
    const mult = diminishingMultiplier(nextIndex);
    return { vol, raw, mult, net: raw * mult };
  }, [candidate.kind, candidate.weightKg, candidate.reps, candidate.durationSec, candidate.intensity, nextIndex]);

  const addSet = () => {
    const { rejections, flag } = inspectSet(candidate, nextIndex, hero.bestE1rm);
    if (rejections.length) {
      notify('reject', rejections.join(' '));
      return;
    }
    const mult = diminishingMultiplier(nextIndex);
    setDraft((d) => [...d, { ...candidate, id: `s${Date.now()}${d.length}`, flag }]);
    if (flag) notify('flag', flag);
    else if (mult < 1) notify('info', `Set ${nextIndex} of ${picked.name} today — XP reduced to ${Math.round(mult * 100)}%.`);
  };

  // Every set's index/multiplier/XP is derived from its position in the
  // draft right now, so deleting one renumbers the rest instead of leaving
  // stale values behind.
  const derivedDraft = useMemo(() => deriveDraft(draft, setsToday), [draft, setsToday]);

  const draftTotals = useMemo(() => {
    const net = derivedDraft.reduce((s, d) => s + d.net, 0);
    const raw = derivedDraft.reduce((s, d) => s + d.raw, 0);
    const remaining = Math.max(0, RULES.dailyXpCap - hero.dailyXp);
    return { raw, net, granted: Math.min(Math.round(net), remaining), remaining };
  }, [derivedDraft, hero.dailyXp]);

  const capped = draftTotals.granted < Math.round(draftTotals.net);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-5 items-start">
      <div className="flex flex-col gap-5">
        <Panel className="p-5">
          <Eyebrow className="mb-3">Pick a movement</Eyebrow>
          <div className="flex flex-wrap gap-2">
            {EXERCISES.map((ex) => {
              const on = ex.name === picked.name;
              return (
                <button
                  key={ex.name}
                  onClick={() => choose(ex)}
                  className={`font-data text-xs uppercase tracking-[0.1em] px-3 py-2 min-h-[44px] rounded border
                    transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-plate-ember
                    focus-visible:ring-offset-2 focus-visible:ring-offset-iron-900
                    ${on
                      ? 'border-plate-ember bg-plate-ember/15 text-plate-ember'
                      : 'border-iron-700 text-chalk-dim hover:border-iron-600 hover:text-chalk'}`}
                >
                  {ex.name}
                </button>
              );
            })}
          </div>
          {alreadyLogged > 0 && (
            <p className="mt-3 text-xs text-chalk-muted">
              {alreadyLogged} {alreadyLogged === 1 ? 'set' : 'sets'} of {picked.name} already logged today.
            </p>
          )}
        </Panel>

        <Panel className="p-5">
          <div className="flex items-center justify-between mb-4">
            <Eyebrow>{picked.name}</Eyebrow>
            <span className="font-data text-[11px] uppercase tracking-[0.14em] text-chalk-muted">
              Set {nextIndex} today
            </span>
          </div>

          <div className="grid grid-cols-2 gap-4">
            {isCardio ? (
              <>
                <Stepper id="log-minutes" label="Minutes" value={minutes} step={5} min={1} max={240} onChange={setMinutes} />
                <Stepper id="log-intensity" label="Intensity" value={intensity} step={1} min={1} max={10} onChange={setIntensity} />
              </>
            ) : (
              <>
                <Stepper id="log-weight" label="Weight (kg)" value={weight} step={2.5} min={0} max={600}
                  onChange={setWeight} suffix={picked.kind === 'BODYWEIGHT' ? 'added' : ''} />
                <Stepper id="log-reps" label="Reps" value={reps} step={1} min={0} max={200} onChange={setReps} />
              </>
            )}
          </div>

          <div className="mt-5 flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
            <div className="flex items-baseline gap-3">
              <div>
                <Eyebrow className="leading-none">This set pays</Eyebrow>
                <div className="flex items-baseline gap-2">
                  <motion.span
                    key={Math.round(preview.net * 10)}
                    className="font-display text-3xl text-plate-ember tabular-nums leading-none"
                    initial={{ scale: 0.92, opacity: 0.4 }}
                    animate={{ scale: 1, opacity: 1 }}
                  >
                    {fmt1(preview.net)}
                  </motion.span>
                  <span className="font-data text-sm text-chalk-muted">XP</span>
                  {preview.mult < 1 && (
                    <span className="font-data text-xs px-1.5 py-0.5 rounded bg-plate-str/20 text-plate-str">
                      ×{preview.mult.toFixed(preview.mult < 0.1 ? 3 : 2)}
                    </span>
                  )}
                </div>
              </div>
              {!isCardio && (
                <div className="pl-3 border-l border-iron-700">
                  <Eyebrow className="leading-none">Volume</Eyebrow>
                  <div className="font-data text-lg text-chalk-dim tabular-nums">{fmt(preview.vol)} kg</div>
                </div>
              )}
            </div>
            <PlateButton onClick={addSet} className="sm:w-auto w-full">
              <span className="inline-flex items-center gap-1.5"><Plus size={15} aria-hidden /> Add set</span>
            </PlateButton>
          </div>

          {preview.mult < 1 && (
            <p className="mt-3 flex items-start gap-1.5 text-xs text-plate-con">
              <AlertTriangle size={13} className="mt-px shrink-0" aria-hidden />
              Past {RULES.freeSetsPerExercise} sets of one movement in a day, each further set pays half the last.
            </p>
          )}
        </Panel>
      </div>

      <Panel className="p-5 lg:sticky lg:top-24">
        <div className="flex items-center justify-between mb-3">
          <Eyebrow>Session</Eyebrow>
          <span className="font-data text-xs text-chalk-muted tabular-nums">{draft.length} sets</span>
        </div>

        <div className="max-h-[280px] overflow-y-auto -mx-1 px-1">
          <AnimatePresence initial={false}>
            {draft.length === 0 && (
              <motion.p key="empty" className="text-sm text-chalk-muted py-6 text-center" exit={{ opacity: 0 }}>
                Add your first set to start the session.
              </motion.p>
            )}
            {derivedDraft.map((d) => (
              <motion.div
                key={d.id}
                layout
                initial={{ opacity: 0, x: 20 }}
                animate={{ opacity: 1, x: 0 }}
                exit={{ opacity: 0, x: 20, height: 0 }}
                className="flex items-center gap-2 py-2 border-b border-iron-700 last:border-0"
              >
                <div className="flex-1 min-w-0">
                  <p className="text-sm text-chalk truncate">
                    {d.exerciseName}
                    {d.flag && <Shield size={12} className="inline ml-1.5 -mt-0.5 text-plate-con" aria-label="Flagged for verification" />}
                  </p>
                  <p className="font-data text-xs text-chalk-muted tabular-nums">
                    {d.kind === 'CARDIO'
                      ? `${d.durationSec / 60} min · intensity ${d.intensity}`
                      : `${fmt1(d.weightKg)} kg × ${d.reps} · set ${d.setIndex}`}
                  </p>
                </div>
                <span className="font-data text-sm text-plate-ember tabular-nums">+{fmt1(d.net)}</span>
                <button
                  onClick={() => setDraft((list) => list.filter((x) => x.id !== d.id))}
                  aria-label={`Remove ${d.exerciseName}`}
                  className="shrink-0 p-[14.5px] -m-[14.5px] text-chalk-muted hover:text-plate-str
                    transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-plate-ember
                    focus-visible:ring-inset rounded"
                >
                  <X size={15} aria-hidden />
                </button>
              </motion.div>
            ))}
          </AnimatePresence>
        </div>

        <div className="mt-4 pt-4 border-t border-iron-700 flex flex-col gap-2">
          <Row label="Raw XP" value={fmt1(draftTotals.raw)} />
          <Row label="After diminishing returns" value={fmt1(draftTotals.net)} />
          <Row label="Daily budget left" value={fmt(draftTotals.remaining)} tone={draftTotals.remaining === 0 ? 'bad' : 'dim'} />
          <div className="flex items-baseline justify-between pt-2 mt-1 border-t border-iron-700">
            <span className="font-data uppercase tracking-[0.14em] text-xs text-chalk">Banked</span>
            <span className="font-display text-2xl text-plate-ember tabular-nums">{fmt(draftTotals.granted)}</span>
          </div>
          {capped && (
            <p className="flex items-start gap-1.5 text-xs text-plate-strText">
              <AlertTriangle size={13} className="mt-px shrink-0" aria-hidden />
              Daily cap reached. XP past {fmt(RULES.dailyXpCap)} is not banked — it resets at midnight.
            </p>
          )}
          <PlateButton onClick={onBank} disabled={draft.length === 0} className="mt-2 w-full">
            <span className="inline-flex items-center gap-1.5"><Zap size={15} aria-hidden /> Bank session</span>
          </PlateButton>
        </div>
      </Panel>
    </div>
  );
}

function Row({ label, value, tone = 'dim' }) {
  const colors = { dim: 'text-chalk-dim', bad: 'text-plate-strText' };
  return (
    <div className="flex items-baseline justify-between text-sm">
      <span className="text-chalk-muted">{label}</span>
      <span className={`font-data tabular-nums ${colors[tone]}`}>{value}</span>
    </div>
  );
}

function Stepper({ id, label, value, onChange, step = 1, min = 0, max = 999, suffix }) {
  const bump = (dir) => onChange(Math.max(min, Math.min(max, Number(value) + dir * step)));
  return (
    <div>
      <label htmlFor={id} className="font-data text-[11px] uppercase tracking-[0.18em] text-chalk-muted">
        {label}{suffix ? ` · ${suffix}` : ''}
      </label>
      <div className="mt-1 flex items-stretch rounded border border-iron-700 overflow-hidden bg-iron-950">
        <button onClick={() => bump(-1)} aria-label={`Decrease ${label}`}
          className="min-w-[44px] min-h-[44px] grid place-items-center text-chalk-muted hover:text-chalk
            hover:bg-iron-800 transition-colors focus:outline-none focus-visible:ring-2
            focus-visible:ring-plate-ember focus-visible:ring-inset">
          <Minus size={14} aria-hidden />
        </button>
        <input
          id={id}
          type="number"
          value={value}
          onChange={(e) => {
            const raw = e.target.value === '' ? 0 : Number(e.target.value);
            onChange(Math.max(min, Math.min(max, raw)));
          }}
          className="flex-1 w-full min-w-0 bg-transparent text-center font-display text-2xl text-chalk py-2
            tabular-nums focus:outline-none focus-visible:ring-2 focus-visible:ring-plate-ember
            focus-visible:ring-offset-2 focus-visible:ring-offset-iron-900 [appearance:textfield]
            [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
        />
        <button onClick={() => bump(1)} aria-label={`Increase ${label}`}
          className="min-w-[44px] min-h-[44px] grid place-items-center text-chalk-muted hover:text-chalk
            hover:bg-iron-800 transition-colors focus:outline-none focus-visible:ring-2
            focus-visible:ring-plate-ember focus-visible:ring-inset">
          <Plus size={14} aria-hidden />
        </button>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------- duels */

function DuelBars({ duel, rival, compact }) {
  const metric = METRICS.find((m) => m.id === duel.metric);
  const top = Math.max(duel.youScore, duel.rivalScore, 1);
  const leading = duel.youScore >= duel.rivalScore;
  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <span className="font-data text-xs uppercase tracking-[0.14em] text-chalk-dim">
          vs {rival.display} · {metric.label}
        </span>
        {duel.status === 'ACTIVE' && (
          <span className="font-data text-xs text-chalk-muted tabular-nums inline-flex items-center gap-1">
            <Timer size={12} aria-hidden /> {duel.daysLeft}d left
          </span>
        )}
      </div>
      <Bar label="You" value={duel.youScore} max={top} color={leading ? '#FF7A1A' : '#4A5261'} unit={metric.unit} />
      <div className="h-1.5" />
      <Bar label={rival.display} value={duel.rivalScore} max={top} color={!leading ? '#D8322C' : '#4A5261'} unit={metric.unit} />
      {!compact && duel.note && <p className="mt-2 text-xs text-chalk-muted">{duel.note}</p>}
    </div>
  );
}

function Bar({ label, value, max, color, unit }) {
  return (
    <div className="flex items-center gap-2">
      <span className="w-14 shrink-0 font-data text-xs text-chalk-dim truncate">{label}</span>
      <div
        className="flex-1 h-2.5 rounded-full bg-iron-950 border border-iron-700 overflow-hidden"
        role="progressbar"
        aria-valuenow={Math.round(value)}
        aria-valuemin={0}
        aria-valuemax={Math.round(max)}
        aria-label={`${label} ${unit}`}
      >
        <motion.div
          className="h-full rounded-full"
          style={{ background: color }}
          initial={{ width: 0 }}
          animate={{ width: `${Math.max(3, (value / max) * 100)}%` }}
          transition={{ type: 'spring', stiffness: 80, damping: 18 }}
        />
      </div>
      <span className="w-20 shrink-0 text-right font-data text-xs text-chalk tabular-nums">
        {fmt(value)} <span className="text-chalk-muted">{unit}</span>
      </span>
    </div>
  );
}

function DuelsHub({ duels, rivalById, onChallenge, onRespond, onSettle }) {

  const [stake, setStake] = useState(100);
  const [days, setDays] = useState(7);

  const busy = new Set(duels.filter((d) => d.status === 'ACTIVE' || d.status === 'PENDING').map((d) => d.rivalId));

  // Keep the selected opponent in sync with who is actually selectable --
  // if the current target is busy (or was never valid), fall back to the

    if (available.length === 0) return;

          const rival = rivalById[duel.rivalId];

          return (
            <motion.div key={duel.id} layout initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }}>

                    </div>
                  </div>
                  <StatusPill duel={duel} />
                </div>

                {duel.status !== 'PENDING' && duel.status !== 'DECLINED' && <DuelBars duel={duel} rival={rival} />}

                {duel.status === 'PENDING' && (
                  <p className="text-sm text-chalk-dim mb-4">

                    <PlateButton tone="ghost" onClick={() => onRespond(duel.id, false)}>Withdraw</PlateButton>

        </PlateButton>

        <p className="mt-3 text-xs text-chalk-muted leading-relaxed">

    </div>
  );

function StatusPill({ duel }) {
  const map = {
    PENDING: ['Pending', 'bg-iron-700 text-chalk-dim'],
    ACTIVE: ['Live', 'bg-plate-ember/20 text-plate-ember'],
    COMPLETED: duel.outcome === 'WIN'
      ? ['Won', 'bg-plate-jade/20 text-plate-jade']
      : duel.outcome === 'DRAW'
        ? ['Draw', 'bg-iron-700 text-chalk-dim']
        : ['Lost', 'bg-plate-str/20 text-plate-str'],
    DECLINED: ['Declined', 'bg-iron-700 text-chalk-dim'],
  };
  const [label, cls] = map[duel.status] ?? ['—', 'bg-iron-700 text-chalk-dim'];
  return (
    <span className={`shrink-0 font-data text-[11px] uppercase tracking-[0.14em] px-2 py-1 rounded ${cls}`}>
      {label}
    </span>
  );
}

function LevelUpOverlay({ levelUp, onDone }) {
  const reduceMotion = useReducedMotion();
  const dismissRef = useRef(null);
  const restoreFocusRef = useRef(null);

  useEffect(() => {
    if (!levelUp) return undefined;
    const t = setTimeout(onDone, 2600);
    return () => clearTimeout(t);
  }, [levelUp, onDone]);

  // Move focus into the dialog on open, restore it to whatever had focus
  // beforehand on close, and let Escape dismiss it like any other dialog.
  useEffect(() => {
    if (!levelUp) return undefined;
    restoreFocusRef.current = document.activeElement;
    dismissRef.current?.focus();
    const onKeyDown = (e) => {
      if (e.key === 'Escape') onDone();
    };
    document.addEventListener('keydown', onKeyDown);
    return () => {
      document.removeEventListener('keydown', onKeyDown);
      if (restoreFocusRef.current instanceof HTMLElement) restoreFocusRef.current.focus();
    };
  }, [levelUp, onDone]);

  return (
    <AnimatePresence>
      {levelUp && (
        <motion.div
          className="fixed inset-0 z-50 grid place-items-center px-4"
          initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
          role="dialog"
          aria-modal="true"
          aria-label="Level up"
        >
          <div className="absolute inset-0 bg-iron-950/85" onClick={onDone} aria-hidden="true" />
          <motion.div
            className="relative text-center"
            initial={{ scale: 0.7, y: 20 }}
            animate={{ scale: 1, y: 0 }}
            exit={{ scale: 0.9, opacity: 0 }}
            transition={{ type: 'spring', stiffness: 220, damping: 16 }}
          >
            {!reduceMotion && [0, 1, 2].map((i) => (
              <motion.div
                key={i}
                aria-hidden
                className="absolute left-1/2 top-1/2 rounded-full border-2 border-plate-ember"
                style={{ width: 160, height: 160, marginLeft: -80, marginTop: -80 }}
                initial={{ scale: 0.4, opacity: 0.9 }}
                animate={{ scale: 2.6, opacity: 0 }}
                transition={{ duration: 1.6, delay: i * 0.22, repeat: Infinity }}
              />
            ))}
            <Sparkles size={30} className="text-plate-con mx-auto mb-2 relative" aria-hidden />
            <p className="font-data uppercase tracking-[0.3em] text-plate-con text-sm relative">Level up</p>
            <p className="font-display text-7xl sm:text-8xl text-chalk leading-none relative">
              {levelUp.newLevel}
            </p>
            <p className="text-chalk-dim mt-2 relative">
              {levelUp.gained > 1 ? `${levelUp.gained} levels in one session.` : 'The bar respects you a little more.'}
            </p>
            <p className="sr-only" role="alert" aria-live="assertive">
              Level up. You reached level {levelUp.newLevel}.
              {levelUp.gained > 1 ? ` ${levelUp.gained} levels in one session.` : ''}
            </p>
            <button
              ref={dismissRef}
              type="button"
              onClick={onDone}
              className="relative mt-4 min-w-[44px] min-h-[44px] px-5 py-2 rounded font-data uppercase
                tracking-[0.14em] text-sm font-semibold bg-plate-ember text-iron-950 hover:bg-[#ff9040]
                transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-chalk
                focus-visible:ring-offset-2 focus-visible:ring-offset-iron-950"
            >
              Continue
            </button>
          </motion.div>
        </motion.div>
      )}
    </AnimatePresence>
  );
}

const TABS = [
  { id: 'dashboard', label: 'Character', Icon: Shield },
  { id: 'log', label: 'Log', Icon: Dumbbell },
  { id: 'duels', label: 'Duels', Icon: Swords },
  { id: 'board', label: 'Ranks', Icon: Trophy },
];

function FitClash() {
  const [signedIn, setSignedIn] = useState(false);
  const [tab, setTab] = useState('dashboard');
  const [hero, setHero] = useState(INITIAL_HERO);
  const [setsToday, setSetsToday] = useState({ 'bench-press': 2 });
  const [draft, setDraft] = useState([]);
  const [duels, setDuels] = useState(SEED_DUELS);
  const [history, setHistory] = useState([
    { id: 'h1', title: 'Push day', when: 'Yesterday', sets: 14, volume: 9640, xp: 640 },
    { id: 'h2', title: 'Intervals', when: '2 days ago', sets: 4, volume: 0, xp: 210 },
    { id: 'h3', title: 'Pull day', when: '3 days ago', sets: 16, volume: 11280, xp: 1000 },
  ]);
  const [toasts, setToasts] = useState([]);
  const [levelUp, setLevelUp] = useState(null);
  const [xpFlash, setXpFlash] = useState(false);
  const [statDelta, setStatDelta] = useState({ str: 0, sta: 0, con: 0 });
  const toastId = useRef(0);
  const statDeltaTimer = useRef(null);

  const rivalById = useMemo(() => Object.fromEntries(RIVALS.map((r) => [r.id, r])), []);

  const stats = useMemo(() => ({
    str: strengthStat(hero.strPoints),
    sta: staminaStat(hero.staPoints),
    con: consistencyStat(hero.activeDays30, hero.streak),
  }), [hero.strPoints, hero.staPoints, hero.activeDays30, hero.streak]);

  const notify = useCallback((tone, message) => {
    const id = ++toastId.current;
    setToasts((t) => [...t.slice(-2), { id, tone, message }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200);
  }, []);

  const dismiss = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);

  // Rivals keep training while you read the page - active duels stay alive.
  // Gated on signedIn so seeded scores do not creep while the login form is up.
  useEffect(() => {
    if (!signedIn) return undefined;
    const timer = setInterval(() => {
      setDuels((list) => list.map((d) => (d.status === 'ACTIVE'
        ? { ...d, rivalScore: d.rivalScore + Math.round((d.metric === 'TOTAL_VOLUME' ? 140 : 6) * Math.random()) }
        : d)));
    }, 5000);
    return () => clearInterval(timer);
  }, [signedIn]);

  /** The full award pipeline, exactly as WorkoutService.logWorkout runs it. */
  const bankSession = () => {
    if (draft.length === 0) return;

    // Resolve every drafted set's index/multiplier/XP from its position in
    // the draft right now -- the same derivation the Logger uses to render
    // it, so what gets banked always matches what was previewed.
    const resolved = deriveDraft(draft, setsToday);

    const netXp = resolved.reduce((s, d) => s + d.net, 0);
    const remaining = Math.max(0, RULES.dailyXpCap - hero.dailyXp);
    const granted = Math.min(Math.round(netXp), remaining);
    const capScale = netXp > 0 ? granted / netXp : 0;

    const effVolume = resolved.reduce((s, d) => s + d.volume * d.mult, 0) * capScale;
    const staGain = resolved.reduce((s, d) => {
      if (d.kind === 'CARDIO') return s + ((d.durationSec / 60) * d.intensity / 10) * d.mult;
      return s + (d.reps >= 12 ? (d.reps - 11) * 0.05 * d.mult : 0);
    }, 0) * capScale;

    const sessionBest = Math.max(...resolved.map((d) => (d.kind === 'STRENGTH' ? epleyE1rm(d.weightKg, d.reps) : 0)), 0);
    const prBonus = sessionBest > hero.bestE1rm && hero.bestE1rm > 0 ? (sessionBest - hero.bestE1rm) * 0.5 : 0;

    // Level roll - a big session can take more than one level.
    let level = hero.level;
    let pool = hero.currentXp + granted;
    let gained = 0;
    while (pool >= xpForNextLevel(level) && level < 999) {
      pool -= xpForNextLevel(level);
      level += 1;
      gained += 1;
    }

    const before = stats;
    const newStrPoints = hero.strPoints + effVolume / 1000 + prBonus;
    const newStaPoints = hero.staPoints + staGain;
    const trainedToday = hero.dailyXp > 0;
    const newStreak = trainedToday ? hero.streak : hero.streak + 1;
    const newActiveDays = trainedToday ? hero.activeDays30 : Math.min(30, hero.activeDays30 + 1);

    setHero((h) => ({
      ...h,
      level,
      currentXp: pool,
      lifetimeXp: h.lifetimeXp + granted,
      strPoints: newStrPoints,
      staPoints: newStaPoints,
      streak: newStreak,
      activeDays30: newActiveDays,
      bestE1rm: Math.max(h.bestE1rm, sessionBest),
      dailyXp: h.dailyXp + granted,
    }));

    setStatDelta({
      str: strengthStat(newStrPoints) - before.str,
      sta: staminaStat(newStaPoints) - before.sta,
      con: consistencyStat(newActiveDays, newStreak) - before.con,
    });
    if (statDeltaTimer.current) clearTimeout(statDeltaTimer.current);
    statDeltaTimer.current = setTimeout(() => setStatDelta({ str: 0, sta: 0, con: 0 }), 3000);

    // Today's set counts drive diminishing returns for the rest of the day.
    setSetsToday((prev) => {
      const next = { ...prev };
      draft.forEach((d) => {
        const key = slugify(d.exerciseName);
        next[key] = (next[key] ?? 0) + 1;
      });
      return next;
    });

    const volume = resolved.reduce((s, d) => s + d.volume, 0);
    setHistory((h) => [{
      id: `h${Date.now()}`,
      title: draft.length > 6 ? 'Full session' : draft[0].exerciseName,
      when: 'Just now',
      sets: draft.length,
      volume,
      xp: granted,
    }, ...h]);

    // Your own duel scores move with the work you just banked.
    setDuels((list) => list.map((d) => {
      if (d.status !== 'ACTIVE') return d;
      const bump = { TOTAL_XP: granted, TOTAL_VOLUME: volume, TOTAL_SETS: draft.length, ACTIVE_DAYS: trainedToday ? 0 : 1 }[d.metric];
      return { ...d, youScore: d.youScore + bump, youVolume: (d.youVolume ?? 0) + volume };
    }));

    setDraft([]);
    setXpFlash(true);
    setTimeout(() => setXpFlash(false), 700);

    if (granted < Math.round(netXp)) {
      notify('reject', `Daily cap reached. ${fmt(granted)} of ${fmt(Math.round(netXp))} XP banked.`);
    } else {
      notify('good', `+${fmt(granted)} XP banked.`);
    }
    if (gained > 0) setLevelUp({ newLevel: level, gained });
  };

  const challenge = ({ rivalId, metric, stake, days }) => {
    const rival = rivalById[rivalId];
    setDuels((list) => [{
      id: `d${Date.now()}`, rivalId, metric, status: 'PENDING', stake, days,
      daysLeft: days, youScore: 0, rivalScore: 0, incoming: false, rated: true,
    }, ...list]);
    notify('good', `Challenge sent to ${rival.display}.`);
  };

  const respond = (duelId, accept) => {
    setDuels((list) => list.map((d) => {
      if (d.id !== duelId) return d;
      if (!accept) return { ...d, status: 'DECLINED' };
      return { ...d, status: 'ACTIVE', youScore: 0, rivalScore: 0, youActiveDays: 0, rivalActiveDays: 0 };
    }));
    notify(accept ? 'good' : 'info', accept ? 'Duel is live. Go earn it.' : 'Challenge dismissed.');
  };

  /** Agent 3's tie-break ladder: score, then active days, then volume, then CON. */
  const settle = (duelId) => {
    const duel = duels.find((d) => d.id === duelId);
    if (!duel || duel.status !== 'ACTIVE') return;

    let verdict = Math.sign(duel.youScore - duel.rivalScore);
    if (verdict === 0) verdict = Math.sign((duel.youActiveDays ?? 0) - (duel.rivalActiveDays ?? 0));
    if (verdict === 0) verdict = Math.sign((duel.youVolume ?? 0) - (duel.rivalVolume ?? 0));
    if (verdict === 0) verdict = Math.sign(stats.con - rivalById[duel.rivalId].con);

    const outcome = verdict > 0 ? 'WIN' : verdict < 0 ? 'LOSS' : 'DRAW';
    const margin = Math.abs(duel.youScore - duel.rivalScore);
    const reward = outcome === 'WIN'
      ? Math.min(300, 150 + duel.stake + Math.round(margin * 0.1))
      : outcome === 'DRAW' ? 25 + Math.round(duel.stake / 2) : 25;
    const unit = METRICS.find((m) => m.id === duel.metric).unit;

    // Duel XP is exempt from the daily cap - it was earned in the arena.
    setHero((h) => {
      let level = h.level;
      let pool = h.currentXp + reward;
      while (pool >= xpForNextLevel(level) && level < 999) { pool -= xpForNextLevel(level); level += 1; }
      return {
        ...h, level, currentXp: pool, lifetimeXp: h.lifetimeXp + reward,
        duelsWon: h.duelsWon + (outcome === 'WIN' ? 1 : 0),
        duelsLost: h.duelsLost + (outcome === 'LOSS' ? 1 : 0),
        duelsDrawn: h.duelsDrawn + (outcome === 'DRAW' ? 1 : 0),
      };
    });

    setDuels((list) => list.map((d) => (d.id === duelId
      ? {
        ...d, status: 'COMPLETED', outcome, daysLeft: 0,
        note: outcome === 'DRAW'
          ? 'Dead even after every tie-breaker.'
          : `${outcome === 'WIN' ? 'You' : rivalById[d.rivalId].display} took it by ${fmt(margin)} ${unit}.`,
      }
      : d)));

    notify(outcome === 'LOSS' ? 'info' : 'good',
      `${outcome === 'WIN' ? 'Victory' : outcome === 'DRAW' ? 'Draw' : 'Defeat'} — +${reward} XP.`);
  };

  if (!signedIn) {
    return (
      <MotionConfig reducedMotion="user">
        <div className="min-h-full bg-iron-900 text-chalk font-body">
          <AuthScreen onEnter={(username) => {
            setHero((h) => ({ ...h, username, display: username === 'you' ? 'You' : username }));
            setSignedIn(true);
          }} />
        </div>
      </MotionConfig>
    );
  }

  return (
    <MotionConfig reducedMotion="user">
    <div className="min-h-full bg-iron-900 text-chalk font-body">
      <header className="sticky z-30 bg-iron-950/90 backdrop-blur border-b border-iron-700"
        style={{ top: 'env(safe-area-inset-top, 0px)' }}>
        <div className="mx-auto max-w-5xl px-4 h-16 flex items-center justify-between gap-4">
          <div className="flex items-center gap-2 min-w-0">
            <Dumbbell size={20} className="text-plate-ember shrink-0" aria-hidden />
            <span className="font-display text-2xl tracking-wide">FITCLASH</span>
          </div>
          <div className="flex items-center gap-1 min-w-0 shrink-0">
            <DailyBudget dailyXp={hero.dailyXp} />
            <button
              onClick={() => { setSignedIn(false); setTab('dashboard'); }}
              className="shrink-0 min-w-[44px] min-h-[44px] grid place-items-center text-chalk-muted
                hover:text-chalk transition-colors focus:outline-none focus-visible:ring-2
                focus-visible:ring-plate-ember focus-visible:ring-offset-2 focus-visible:ring-offset-iron-900 rounded"
              aria-label="Log out"
            >
              <LogOut size={18} aria-hidden />
            </button>
          </div>
        </div>

        <nav className="mx-auto max-w-5xl px-4 flex gap-1 overflow-x-auto" aria-label="Sections">
          {TABS.map(({ id, label, Icon }) => (
            <button
              key={id}
              onClick={() => setTab(id)}
              aria-current={tab === id ? 'page' : undefined}
              className={`relative font-data uppercase tracking-[0.14em] text-xs font-semibold px-3
                min-h-[44px] inline-flex items-center gap-1.5 whitespace-nowrap transition-colors
                focus:outline-none focus-visible:ring-2 focus-visible:ring-plate-ember focus-visible:ring-inset
                ${tab === id ? 'text-plate-ember' : 'text-chalk-muted hover:text-chalk'}`}
            >
              <Icon size={14} aria-hidden /> {label}
              {tab === id && (
                <motion.span layoutId="tabRail" className="absolute left-2 right-2 -bottom-px h-0.5 bg-plate-ember"
                  transition={{ type: 'spring', stiffness: 380, damping: 32 }} />
              )}
            </button>
          ))}
        </nav>
      </header>

      <main className="mx-auto max-w-5xl px-4 py-6 pb-28">
        <AnimatePresence mode="wait">
          <motion.div
            key={tab}
            initial={{ opacity: 0, y: 10 }}
            animate={{ opacity: 1, y: 0 }}
            exit={{ opacity: 0, y: -6 }}
            transition={{ duration: 0.2 }}
          >
            {tab === 'dashboard' && (
              <Dashboard
                hero={hero} stats={stats} statDelta={statDelta} xpFlash={xpFlash}
                history={history} duels={duels} rivalById={rivalById}
                onGoLog={() => setTab('log')}
              />
            )}
            {tab === 'log' && (
              <Logger
                hero={hero} setsToday={setsToday} draft={draft} setDraft={setDraft}
                onBank={bankSession} notify={notify}
              />
            )}
            {tab === 'duels' && (
              <DuelsHub
                duels={duels} rivalById={rivalById}
                onChallenge={challenge} onRespond={respond} onSettle={settle}
              />
            )}
            {tab === 'board' && <Leaderboard hero={hero} stats={stats} />}
          </motion.div>
        </AnimatePresence>
      </main>

      <Toasts toasts={toasts} dismiss={dismiss} />
      <LevelUpOverlay levelUp={levelUp} onDone={() => setLevelUp(null)} />
    </div>
    </MotionConfig>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FitClash));
</script>
