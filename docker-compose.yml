services:
  postgres:
    image: postgres:16
    container_name: fitclash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitclash
    ports:
      - "5432:5432"
    volumes:
      - fitclash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitclash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitclash-postgres-data:
