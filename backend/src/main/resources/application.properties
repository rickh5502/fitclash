# =====================================================================
#  FitClash API - application.properties
#  Agent 4 (DevOps, Environment & Security Architect)
#  Every value has a working local default, so the app boots with:
#    createdb fitclash && ./mvnw spring-boot:run
#  Override anything through environment variables in CI / prod.
# =====================================================================

spring.application.name=fitclash-api
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------------------------------------------------------------
#  PostgreSQL
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitclash}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=fitclash-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=update keeps first-run friction at zero. db/schema.sql is the
#  canonical DDL: to run script-first instead, set
#    spring.sql.init.mode=always  and  spring.jpa.hibernate.ddl-auto=validate
#  (leave defer-datasource-initialization=false so the script runs first).
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.defer-datasource-initialization=false

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------
#  JWT  (HS256 - the secret MUST be >= 32 bytes or the app fails fast)
# ---------------------------------------------------------------------
fitclash.jwt.secret=${JWT_SECRET:dev-only-fitclash-secret-please-rotate-me-0123456789}
fitclash.jwt.expiration-seconds=${JWT_TTL_SECONDS:86400}
fitclash.jwt.issuer=fitclash-api

# ---------------------------------------------------------------------
#  CORS - the React dev server
# ---------------------------------------------------------------------
fitclash.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

# ---------------------------------------------------------------------
#  Game rules (Agent 2 anti-cheat + Agent 3 RPG mechanics)
#  Tunable without a redeploy of the game logic.
# ---------------------------------------------------------------------
fitclash.rules.daily-xp-cap=1000
fitclash.rules.free-sets-per-exercise=5
fitclash.rules.diminishing-factor=0.5
fitclash.rules.min-multiplier=0.03125
fitclash.rules.strength-xp-divisor=60.0
# XP per minute of cardio at intensity 5; scales linearly with intensity.
fitclash.rules.cardio-xp-per-minute=3.0
# Session-wide curve on top of the per-exercise one. Without it, the per-exercise
# rule is dodged ~3.2x by splitting one movement across invented names.
fitclash.rules.free-sets-per-day=20
fitclash.rules.daily-decay-factor=0.8
fitclash.rules.daily-min-multiplier=0.1
# Cardio is self-reported, so it cannot fill the daily budget on its own.
fitclash.rules.daily-cardio-xp-cap=400
# Backdated sessions bank XP but only recent ones build a streak.
fitclash.rules.streak-credit-max-age-days=1
fitclash.rules.max-set-volume-kg=5000.0
fitclash.rules.max-weight-kg=500.0
fitclash.rules.max-reps-per-set=150
fitclash.rules.max-sets-per-exercise-per-day=25
fitclash.rules.max-sets-per-session=120
fitclash.rules.max-workouts-per-day=6
fitclash.rules.max-cardio-seconds=14400
fitclash.rules.max-backdate-days=14
fitclash.rules.review-flag-ratio=0.75
fitclash.rules.max-rated-duels-per-week=3
fitclash.rules.duel-base-reward-xp=150
fitclash.rules.duel-max-reward-xp=300
fitclash.rules.duel-consolation-xp=25

# ---------------------------------------------------------------------
#  Actuator / logging
# ---------------------------------------------------------------------
logging.level.com.fitclash=INFO
logging.level.org.springframework.security=INFO
