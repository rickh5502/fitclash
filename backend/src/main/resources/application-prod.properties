# =====================================================================
#  FitClash API - application-prod.properties
#
#  Activate with SPRING_PROFILES_ACTIVE=prod (or -Dspring.profiles.active=prod)
#  for any deployment that is reachable by anyone other than a contributor on
#  localhost. Unlike application.properties, these two secrets have NO
#  fallback value: Spring fails fast at startup with an
#  "Could not resolve placeholder" error if JWT_SECRET or DB_PASSWORD are not
#  set in the environment. That is the point - a forgotten secret must be a
#  deploy-time failure, not a silently-running server signing tokens with a
#  key anyone can read in the public git history.
#
#  StartupSafetyGuard (com.fitclash.config) is a second, independent check:
#  even if this file were ever edited to add a fallback again, it still
#  refuses to boot under the "prod" profile if the resolved secret matches
#  the known committed default.
# =====================================================================

fitclash.jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}
